name: Android bridge build
on:
  push:
    branches: [feature/music-display, feature/music-hud-prototype]
    paths:
      - 'android-bridge/**'
      - '.github/workflows/android-bridge.yml'
  pull_request:
    paths:
      - 'android-bridge/**'
      - '.github/workflows/android-bridge.yml'
concurrency:
  group: android-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap pinned Android build tools
        run: python android-bridge/bootstrap.py "$RUNNER_TEMP/g3-tools"
      - name: Compile APK
        run: python android-bridge/build.py "$RUNNER_TEMP/g3-tools"
      - name: Run protocol tests
        run: python android-bridge/test.py "$RUNNER_TEMP/g3-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: g3-connect-music-display
          path: dist/g3-connect.apk
          if-no-files-found: error
